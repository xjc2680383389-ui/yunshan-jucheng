<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>云山巨城 · 体素山水</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<canvas id="gl"></canvas>

<!-- 左上：作品名牌 -->
<div id="brand" class="panel">
  <div class="title">云山巨城 · 体素山水</div>
  <div class="sub">程序化生成 · 固定种子 · 0.2m 体素</div>
</div>

<!-- 右上：模式与工具 -->
<div id="modes" class="panel">
  <button id="btnOrbit" class="btn on">环绕</button>
  <button id="btnWalk" class="btn">漫游</button>
  <button id="btnTour" class="btn">巡游</button>
  <span class="sep"></span>
  <button id="btnPerf" class="btn">性能模式</button>
  <button id="btnHelp" class="btn">操作说明</button>
</div>

<!-- 底部中央：昼夜控制台 -->
<div id="console" class="panel">
  <button id="btnPlay" class="btn" title="播放/暂停">⏸</button>
  <span id="timeLabel">07:30</span>
  <div class="speeds">
    <button id="sp60" class="btn sm">60×</button>
    <button id="sp360" class="btn sm on">360×</button>
    <button id="sp1440" class="btn sm">1440×</button>
  </div>
  <input id="timeSlider" type="range" min="0" max="24" step="0.05" value="7.5">
</div>

<!-- 左下：帧率 -->
<div id="fps">-- FPS</div>

<!-- 操作说明 -->
<div id="help" class="modal">
  <div class="card">
    <div class="card-title">操作说明<button id="btnHelpClose" class="btn sm">关闭</button></div>
    <p><b>环绕</b>（默认）：左键拖动旋转视角，滚轮缩放，右键拖动平移；触屏单指旋转、双指缩放。</p>
    <p><b>漫游</b>：点击画布锁定指针，WASD 移动、鼠标转视、Shift 加速、Esc 退出。</p>
    <p><b>巡游</b>：一键自动沿全城路线游览，空格或 Esc 退出接管。</p>
    <p><b>昼夜</b>：底部控制台可暂停/播放、拖动时间滑条任意设定时刻、切换流逝速度（60×/360×/1440×）。推荐 06:30 日出、19:00 日落、21:00 灯火。</p>
    <p><b>性能模式</b>：低配电脑选开（关闭阴影、拉近雾距）。</p>
  </div>
</div>

<!-- 载入遮罩 -->
<div id="loading">
  <div class="title">云山巨城</div>
  <div id="loadingPct">正在生成世界 … 0%</div>
  <div class="bar"><div id="loadingBar"></div></div>
</div>

<div id="err"></div>
<div id="autotest" style="display:none"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
